name: CI Pipeline

on:
  push:
    branches: [ "main", "fixingBugs", "updates-and-fixes" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Roster and Universe Mask
        run: |
          python -c "import pandas as pd; df = pd.read_csv('data/black_ceo_roster.csv'); print(f'Roster loaded: {len(df)} records')"
          python -m src.universe
