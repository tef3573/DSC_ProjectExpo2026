name: Pylint

on:
  push:
    branches: [ "main", "fixingBugs", "updates-and-fixes" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: Run Pylint on src/
        run: |
          # Fails only if critical errors occur or score falls below 5.0
          pylint src/ --fail-under=5.0 || pylint src/ --errors-only